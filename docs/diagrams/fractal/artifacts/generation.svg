      <text x="49" y="54" font-size="14" font-weight="600" fill="#243b34"><tspan x="49" dy="0">Application core</tspan></text>
      <text x="45" y="78" font-size="12" font-weight="400" fill="#67746e"></text>
      </g><g data-element="core.styles"><rect x="66" y="351" width="262" height="1135" rx="14" fill="#f4f6f3" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(302 368) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="90" y="381" font-size="14" font-weight="600" fill="#243b34"><tspan x="90" dy="0">Style generators</tspan></text>
      <text x="86" y="405" font-size="12" font-weight="400" fill="#67746e"></text>
      </g><g data-element="core.exporters"><rect x="66" y="1794" width="262" height="456" rx="14" fill="#f4f6f3" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(302 1811) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="90" y="1824" font-size="14" font-weight="600" fill="#243b34"><tspan x="90" dy="0">Export adapters</tspan></text>
      <text x="86" y="1848" font-size="12" font-weight="400" fill="#67746e"></text>
      </g><path d="M329,1640 L526.32,1640 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M772.32,1234 L788.32,1234 L788.32,89 L49,89 L49,485 L65,485" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M772.32,1234 L788.32,1234 L788.32,2266 L49,2266 L49,1928 L65,1928" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,495.5 L526.32,495.5 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,1399.5 L526.32,1399.5 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,661 L526.32,661 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,1034.5 L526.32,1034.5 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,826.5 L526.32,826.5 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,2138 L526.32,2138 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M304,1938.5 L526.32,1938.5 L526.32,1234 L558.32,1234" fill="none" stroke="#84948b" stroke-width="1.5" marker-end="url(#arrow)"/><g data-element="core.library"><rect x="116" y="1518" width="212" height="244" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(302 1535) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="136" y="1550" font-size="14" font-weight="600" fill="#243b34"><tspan x="136" dy="0">Library service</tspan></text>
      <text x="136" y="1574" font-size="12" font-weight="400" fill="#67746e"><tspan x="136" dy="0">Create, List, Collection,</tspan><tspan x="136" dy="17">Avatar, Render. Validates</tspan><tspan x="136" dy="17">count 1..100, name ≤120</tspan><tspan x="136" dy="17">chars, seed ≤4096 bytes;</tspan><tspan x="136" dy="17">mints col_/av_ IDs; resolves</tspan><tspan x="136" dy="17">each avatar’s concrete</tspan><tspan x="136" dy="17">recipe inputs; reads the</tspan><tspan x="136" dy="17">store on every list so a</tspan><tspan x="136" dy="17">long-running studio sees</tspan><tspan x="136" dy="17">CLI-created collections at</tspan><tspan x="136" dy="17">once.</tspan></text>
      </g><g data-element="core.discovery"><rect x="91.71000000000002" y="105" width="218.57999999999996" height="214" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(284.29 122) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="111.71" y="137" font-size="14" font-weight="600" fill="#243b34"><tspan x="111.71" dy="0">Discovery &amp;</tspan><tspan x="111.71" dy="20">instructions</tspan></text>
      <text x="111.71" y="182" font-size="12" font-weight="400" fill="#67746e"><tspan x="111.71" dy="0">One table of operations with</tspan><tspan x="111.71" dy="17">their CLI usage and HTTP</tspan><tspan x="111.71" dy="17">method/path, the agent</tspan><tspan x="111.71" dy="17">instructions text, and the</tspan><tspan x="111.71" dy="17">capabilities document with</tspan><tspan x="111.71" dy="17">limits. Feeds help output and</tspan><tspan x="111.71" dy="17">the /api/v1 discovery</tspan><tspan x="111.71" dy="17">routes.</tspan></text>
      </g><g data-element="core.engine"><rect x="559.3199999999999" y="1103.5" width="212" height="261" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(745.32 1120.5) scale(0.667)" color="#739886" opacity="0.85"><title>Component</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7V4h13v16H7v-3m0-6v2"/><rect x="3" y="7" width="8" height="4" rx="1"/><rect x="3" y="13" width="8" height="4" rx="1"/></g></g>
      <text x="579.32" y="1135.5" font-size="14" font-weight="600" fill="#243b34"><tspan x="579.32" dy="0">Generation engine</tspan></text>
      <text x="579.32" y="1159.5" font-size="12" font-weight="400" fill="#67746e"><tspan x="579.32" dy="0">Registry of style</tspan><tspan x="579.32" dy="17">generators and format</tspan><tspan x="579.32" dy="17">exporters. Resolves and</tspan><tspan x="579.32" dy="17">validates appearance inputs</tspan><tspan x="579.32" dy="17">from each style’s</tspan><tspan x="579.32" dy="17">published descriptor,</tspan><tspan x="579.32" dy="17">rejects oversized</tspan><tspan x="579.32" dy="17">dimensions before</tspan><tspan x="579.32" dy="17">generating, normalizes</tspan><tspan x="579.32" dy="17">options against native</tspan><tspan x="579.32" dy="17">artwork size, then exports.</tspan><tspan x="579.32" dy="17">No style-specific branches.</tspan></text>
      </g><g data-element="core.styles.gorey"><rect x="91" y="416" width="212" height="159" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 433) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="448" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">Gorey</tspan></text>
      <text x="111" y="472" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">The original engraved</tspan><tspan x="111" dy="17">pen-and-ink portrait,</tspan><tspan x="111" dy="17">64×72, preserved exactly</tspan><tspan x="111" dy="17">from the TypeScript</tspan><tspan x="111" dy="17">reference. No appearance</tspan><tspan x="111" dy="17">inputs.</tspan></text>
      </g><g data-element="core.styles.gorey_expanded"><rect x="91" y="1337" width="212" height="125" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 1354) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="1369" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">Gorey Expanded</tspan></text>
      <text x="111" y="1393" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">A wider cast: more face</tspan><tspan x="111" dy="17">shapes, ages, hairstyles,</tspan><tspan x="111" dy="17">clothes, and accessories on</tspan><tspan x="111" dy="17">the same 64×72 canvas.</tspan></text>
      </g><g data-element="core.styles.picasso"><rect x="91" y="607" width="212" height="108" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 624) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="639" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">Picasso</tspan></text>
      <text x="111" y="663" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">Bold contours, muted color,</tspan><tspan x="111" dy="17">restrained cubist planes,</tspan><tspan x="111" dy="17">64×72.</tspan></text>
      </g><g data-element="core.styles.pebble"><rect x="91" y="938" width="212" height="193" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 955) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="970" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">Pebble</tspan></text>
      <text x="111" y="994" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">64×64 pudgy characters.</tspan><tspan x="111" dy="17">Publishes a color input with</tspan><tspan x="111" dy="17">15 palette values plus</tspan><tspan x="111" dy="17">Random; Random is resolved</tspan><tspan x="111" dy="17">per seed into a concrete</tspan><tspan x="111" dy="17">saved color without</tspan><tspan x="111" dy="17">consuming geometry</tspan><tspan x="111" dy="17">randomness.</tspan></text>
      </g><g data-element="core.styles.companions"><rect x="91" y="747" width="212" height="159" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 764) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="779" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">Companions</tspan></text>
      <text x="111" y="803" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">128×128 dogs and cats.</tspan><tspan x="111" dy="17">Publishes an animal input</tspan><tspan x="111" dy="17">(dog default, cat, mixed);</tspan><tspan x="111" dy="17">Mixed picks one species per</tspan><tspan x="111" dy="17">seed so a saved recipe</tspan><tspan x="111" dy="17">always holds dog or cat.</tspan></text>
      </g><g data-element="core.styles.field_birds"><rect x="91" y="1163" width="212" height="142" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 1180) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="1195" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">Field Birds</tspan></text>
      <text x="111" y="1219" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">160×160 invented bird</tspan><tspan x="111" dy="17">species: eight body types,</tspan><tspan x="111" dy="17">twelve palettes, all chosen</tspan><tspan x="111" dy="17">from the seed alone. No</tspan><tspan x="111" dy="17">inputs.</tspan></text>
      </g><g data-element="core.exporters.svg"><rect x="91" y="2050" width="212" height="176" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 2067) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="2082" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">SVG exporter</tspan></text>
      <text x="111" y="2106" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">Returns native SVG verbatim</tspan><tspan x="111" dy="17">at native size; otherwise</tspan><tspan x="111" dy="17">validates the markup and</tspan><tspan x="111" dy="17">wraps it in a sized outer</tspan><tspan x="111" dy="17">SVG with a translate/scale</tspan><tspan x="111" dy="17">group and an optional</tspan><tspan x="111" dy="17">clipPath circle.</tspan></text>
      </g><g data-element="core.exporters.png"><rect x="91" y="1859" width="212" height="159" rx="14" fill="#ffffff" stroke="#d9e0da" stroke-width="1.3"/>
      <g transform="translate(277 1876) scale(0.667)" color="#739886" opacity="0.85"><title>Adapter</title><g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h14l-3-3m3 3-3 3M21 17H7l3-3m-3 3 3 3"/></g></g>
      <text x="111" y="1891" font-size="14" font-weight="600" fill="#243b34"><tspan x="111" dy="0">PNG exporter</tspan></text>
      <text x="111" y="1915" font-size="12" font-weight="400" fill="#67746e"><tspan x="111" dy="0">Pure-Go rasterization with</tspan><tspan x="111" dy="17">oksvg and rasterx (no CGO,</tspan><tspan x="111" dy="17">no network, no scripts).</tspan><tspan x="111" dy="17">Clips to the native viewport</tspan><tspan x="111" dy="17">and applies an analytic</tspan><tspan x="111" dy="17">one-pixel circle mask.</tspan></text>
      </g><g><rect x="389.51" y="1646" width="116.29999999999997" height="53" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="1659" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Resolve inputs per</tspan><tspan x="447.65999999999997" dy="15">seed; render a</tspan><tspan x="447.65999999999997" dy="15">saved recipe</tspan></text></g><g><rect x="385" y="95" width="125.31999999999996" height="53" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="108" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Generate native SVG</tspan><tspan x="447.65999999999997" dy="15">for a seed and</tspan><tspan x="447.65999999999997" dy="15">resolved inputs</tspan></text></g><g><rect x="412.05999999999995" y="2272" width="71.19999999999999" height="53" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="2285" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Export at</tspan><tspan x="447.65999999999997" dy="15">normalized</tspan><tspan x="447.65999999999997" dy="15">dimensions</tspan></text></g><g><rect x="412.445" y="501.5" width="70.42999999999999" height="23" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="514.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Generator</tspan></text></g><g><rect x="412.445" y="1405.5" width="70.42999999999999" height="23" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="1418.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Generator</tspan></text></g><g><rect x="412.445" y="667" width="70.42999999999999" height="23" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="680" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Generator</tspan></text></g><g><rect x="385.22" y="1040.5" width="124.87999999999995" height="38" rx="5" fill="#fafbf8"/><text x="447.66" y="1053.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.66" dy="0">InputGenerator +</tspan><tspan x="447.66" dy="15">RecipeInputResolver</tspan></text></g><g><rect x="385.22" y="832.5" width="124.87999999999995" height="38" rx="5" fill="#fafbf8"/><text x="447.66" y="845.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.66" dy="0">InputGenerator +</tspan><tspan x="447.66" dy="15">RecipeInputResolver</tspan></text></g><g><rect x="412.445" y="1240" width="70.42999999999999" height="23" rx="5" fill="#fafbf8"/><text x="447.65999999999997" y="1253" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.65999999999997" dy="0">Generator</tspan></text></g><g><rect x="404.305" y="2144" width="86.71" height="23" rx="5" fill="#fafbf8"/><text x="447.66" y="2157" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.66" dy="0">Exporter svg</tspan></text></g><g><rect x="404.305" y="1944.5" width="86.71" height="23" rx="5" fill="#fafbf8"/><text x="447.66" y="1957.5" text-anchor="middle" font-size="11" fill="#66766d"><tspan x="447.66" dy="0">Exporter png</tspan></text></g></g>
  <g data-export-layer="legend"></g><path d="M96 1010H1824" stroke="#dce2db"/><text x="96" y="1044" font-size="13" fill="#78867c">STRUCTURE · CURRENT SYSTEM</text><text x="1824" y="1044" text-anchor="end" font-size="13" fill="#78867c">FOCUS: Application core · 10 external connections outside view</text></g></svg>
