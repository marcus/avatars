<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description" data-theme="grove" data-theme-appearance="light">
  <title id="title">Avatars / From seed to image</title><desc id="description">Inside the core: the engine resolves a style&apos;s inputs per seed, asks the generator for native SVG, normalizes the requested size, and hands the artwork to a format adapter.. Architecture structure.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#84948b"/></marker></defs>
  <rect width="1920" height="1080" fill="#fafbf8"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="96" y="58" font-size="12" letter-spacing="3" fill="#607c69">FRACTAL / SYSTEM MODEL</text>
  <g data-export-layer="title"><text x="96" y="116" font-size="48" font-weight="600" fill="#243b34"><tspan x="96" dy="0">Avatars / From seed to image</tspan></text></g>
  <g data-export-layer="subtitle"><text x="96" y="170" font-size="19" font-weight="400" fill="#6e7d72"><tspan x="96" dy="0">Inside the core: the engine resolves a style&apos;s inputs per seed, asks the generator for native SVG, normalizes the requested size, and hands the artwork to a format adapter.</tspan></text></g>
  <g data-export-layer="diagram" transform="translate(826.269 210) scale(0.319)"><g data-element="core"><rect x="25" y="24" width="787.3199999999999" height="2325" rx="14" fill="#f4f6f3" stroke="#d9e0da" stroke-width="1.3"/>
